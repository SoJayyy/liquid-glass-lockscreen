name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios27-liquid-glass-lockscreen-v2-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Extract Android Studio project
        run: unzip -q ios27-liquid-glass-lockscreen-v2-project.zip -d .

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p ios27-liquid-glass-lockscreen assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ios27-liquid-glass-lockscreen-debug-apk
          path: ios27-liquid-glass-lockscreen/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
