name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios27-liquid-glass-lockscreen-v2-project.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platform-tools'

- name: Install Android SDK packages
  run: |
    sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Extract Android Studio project
        run: |
          unzip -q ios27-liquid-glass-lockscreen-v2-project.zip -d project

      - name: Find Android project directory
        run: |
          PROJECT_FILE=$(find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "Android Gradle project not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

          echo "Project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            "$PROJECT_DIR/gradlew" -p "$PROJECT_DIR" assembleDebug --no-daemon
          else
            gradle -p "$PROJECT_DIR" assembleDebug --no-daemon
          fi

      - name: Locate APK
        run: |
          APK_PATH=$(find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/debug/*.apk' \
            -print -quit)

          if [ -z "$APK_PATH" ]; then
            echo "APK file not found!"
            exit 1
          fi

          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "APK generated: $APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ios27-liquid-glass-lockscreen-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
          
